<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  // Apply persisted theme before paint to avoid FOUC.
  // Validate against known theme IDs to guard against corrupted storage.
  (function() {
    var VALID_THEMES = ['dark','light','dracula','nord','catppuccin','rose-pine','gruvbox','solarized','tokyo-night','monokai'];
    var t = localStorage.getItem('mini_agent_theme');
    if (!t || VALID_THEMES.indexOf(t) === -1) t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
    // Store back the validated value so React picks up a clean theme id
    localStorage.setItem('mini_agent_theme', t);
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:*;">
  <title>mini_agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
